  <script>
const SUPABASE_URL ="https://kjsxeznhnhlfoyozffjf.supabase.co";
const SUPABASE_KEY = "sb_publishable_q4JWDPQly0ijCl43f2ODEw_7-vcNUIq";
let rawDiscsData = [];
let currentFilter = "in_stock";
let currentSort = "stock_qty";
let currentTimeDimension = "month";
let analyticsStartDate = null;
let analyticsEndDate = null;
let salesChart = null;
let currentGameName = "";
function formatMoney(num) {
  return Number(num || 0).toLocaleString(
    "zh-CN",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );
}

// 从 Supabase 云端加载游戏数据（封面与评分已由云函数自动在后台抓取固化）
function loadGames() {
  fetch(`${SUPABASE_URL}/rest/v1/games_inventory?select=*`, {
    headers: { apikey: SUPABASE_KEY }
  })
  .then(res => res.json())
  .then(data => {
    rawDiscsData = data || [];
    renderDashboardAndList();
    renderAnalytics();
  })
  .catch(error => {
    console.error("加载数据失败:", error);
    document.getElementById("result").innerHTML = `<div style="text-align: center; color: #d63031; padding: 40px 0;">网络加载失败，请检查网络</div>`;
  });
}

function renderDashboardAndList() {
  const gamesMap = {};
  rawDiscsData.forEach(disc => {
    const name =
  (disc.game_name || "未知游戏")
    .trim();

    if (!gamesMap[name]) {
      gamesMap[name] = {
        game_name: name,
        // 直接读取数据库中由云函数自动抓取并持久化保存的封面与评分
        cover_url: disc.cover_url || "",
        total_qty: 0,
        sold_qty: 0,
        transit_qty: 0,
        stock_qty: 0,
        total_profit: 0,
        total_cost: 0,
        discs: []
      };
    }
    const g = gamesMap[name];
    g.discs.push(disc);
    if (disc.cover_url) g.cover_url = disc.cover_url;

    const buyPrice = Number(disc.purchase_price || 0);
    const sellPrice = Number(disc.selling_price || 0);
    const shipCost = Number(disc.shipping_cost || 0);

    if (disc.status === "已售出") {
      g.sold_qty += 1;
      const itemProfit = disc.profit !== null && disc.profit !== undefined ? Number(disc.profit) : (sellPrice - buyPrice - shipCost);
      g.total_profit += itemProfit;
    } else {
  g.total_qty += 1;
  g.total_cost += buyPrice;
  if (disc.status === "运输中") {
    g.transit_qty += 1;
  } else {
    g.stock_qty += 1;
  }
}
    
    
  });

  const gamesList = Object.values(gamesMap);
  const filteredGames = gamesList.filter(g => {
    if (currentFilter === "in_stock") return g.total_qty > 0;
    return true;
  });
filteredGames.sort((a,b)=>{

  const aHistorical =
    a.discs?.some(x => x.is_historical);

  const bHistorical =
    b.discs?.some(x => x.is_historical);

  if (aHistorical) return 1;
  if (bHistorical) return -1;

  switch(currentSort){

    case "total_qty":
      return (
        (b.total_qty + b.sold_qty)
        -
        (a.total_qty + a.sold_qty)
      );

case "stock_qty":
  if (b.total_qty !== a.total_qty) {
    return b.total_qty - a.total_qty;
  }
  return b.total_profit - a.total_profit;
    case "cost":
      return b.total_cost - a.total_cost;

    case "profit":
    default:
      return b.total_profit - a.total_profit;
  }
});
let grandTotalProfit = 0;
let totalTitles = 0;
let totalCopies = 0;
let inventoryTitles = 0;
let inventoryCopies = 0;
let inventoryCost = 0;
gamesList.forEach(g => {
  grandTotalProfit += g.total_profit;
  const historicalDisc =
    g.discs.find(x => x.is_historical);
  if (historicalDisc) {
    totalTitles +=
      Number(historicalDisc.total_titles || 0);
    totalCopies +=
      Number(historicalDisc.total_copies || 0);
  } else {
    totalTitles += 1;
    totalCopies +=
      g.total_qty +
      g.sold_qty;
    if (g.total_qty > 0) {
      inventoryTitles += 1;
    }
    inventoryCopies += g.total_qty;
    inventoryCost += g.total_cost;
  }
});

      document.getElementById("summary").innerHTML = `
  <div class="summary-card">
    <div class="summary-title">总利润</div>
    <div class="summary-value"
         style="color:${
           grandTotalProfit >= 0
             ? '#00b894'
             : '#d63031'
         };">
      ¥${formatMoney(grandTotalProfit)}
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">当前库存</div>
    <div class="summary-value">
      ${inventoryCopies}张 / ${inventoryTitles}款
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">库存成本</div>
    <div class="summary-value">
      ¥${formatMoney(inventoryCost)}
    </div>
  </div>
  <div class="summary-card">
    <div class="summary-title">游戏总数</div>
    <div class="summary-value">
      ${totalCopies}张 / ${totalTitles}款
    </div>
  </div>
`;
  let html = "";
  filteredGames.forEach(g => {
const historicalDisc =
  g.discs.find(x => x.is_historical);
const isHistorical =
  historicalDisc?.is_historical;

    const profitColor = g.total_profit > 0 ? "#00b894" : g.total_profit < 0 ? "#d63031" : "#636e72";
    const coverUrl =
  g.cover_url &&
  g.cover_url.trim()
    ? g.cover_url
: "";
    const avgCost = g.total_qty > 0 ? Math.round(g.total_cost / g.total_qty) : 0;
if (isHistorical) {
html += `
  <div class="card" onclick="openGameDetailModal('${g.game_name}')">
    <div class="card-left">
      <img class="cover" src="${coverUrl}" alt="封面">
      <div class="details">
        <h2>${g.game_name}</h2>
        <div class="profit-box">
          <span class="profit-label">
            总利润
          </span>
          <span
            class="profit-text"

function renderAnalytics() {
  let soldDiscs = rawDiscsData.filter(d => d.status === "已售出" && d.sold_date);
if (
  analyticsStartDate &&
  analyticsEndDate
) {
  soldDiscs =
    soldDiscs.filter(
      d =>
        d.sold_date >= analyticsStartDate &&
        d.sold_date <= analyticsEndDate
    );
}

  if (currentTimeDimension === "custom") {
    const startDate = document.getElementById("customStartDate").value;
    const endDate = document.getElementById("customEndDate").value;
    if (startDate && endDate) soldDiscs = soldDiscs.filter(d => d.sold_date >= startDate && d.sold_date <= endDate);
  }

  const timeMap = {};
  soldDiscs.forEach(disc => {
    let key = disc.sold_date;
    if (currentTimeDimension === "month") key = disc.sold_date.substring(0, 7);
    else if (currentTimeDimension === "year") key = disc.sold_date.substring(0, 4);
    else if (currentTimeDimension === "custom") key = "自定义区间汇总";

    if (!timeMap[key]) timeMap[key] = { profit: 0, count: 0, sales: 0 };
    const buyPrice = Number(disc.purchase_price || 0);
    const sellPrice = Number(disc.selling_price || 0);
    const shipCost = Number(disc.shipping_cost || 0);
    const profit = disc.profit !== null && disc.profit !== undefined ? Number(disc.profit) : (sellPrice - buyPrice - shipCost);

timeMap[key].profit += profit;
timeMap[key].sales += sellPrice;
if (disc.is_historical) {
  timeMap[key].count +=
    Number(disc.total_copies || 0);
} else {
  timeMap[key].count += 1;
}
  });

  const sortedTimes = Object.keys(timeMap).sort().reverse();
  let timeHtml = "";
  sortedTimes.forEach(t => {
    const item = timeMap[t];
    timeHtml += `
      <div class="time-card">
        <div class="time-card-date">${t}</div>
        <div class="time-card-profit" style="color: ${item.profit >= 0 ? '#00b894' : '#d63031'};"> ¥${formatMoney(item.profit)}
</div>
        <div class="time-card-sub">售出 ${item.count} 张 / 销售额 ¥${formatMoney(item.sales)}
</div>
      </div>
    `;
  });
  document.getElementById("timeBreakdownList").innerHTML = timeHtml || `<div class="empty-tip">该时间范围内暂无已售数据</div>`;

  const gameStats = {};
  soldDiscs.forEach(disc => {
const name =
  (disc.game_name || "未知游戏")
    .trim();
    if (!gameStats[name]) gameStats[name] = { profit: 0, sold: 0 };
    gameStats[name].sold += 1;
    const buyPrice = Number(disc.purchase_price || 0);
    const sellPrice = Number(disc.selling_price || 0);
    const shipCost = Number(disc.shipping_cost || 0);
    const profit = disc.profit !== null && disc.profit !== undefined ? Number(disc.profit) : (sellPrice - buyPrice - shipCost);
    gameStats[name].profit += profit;
  });

  const statsList = Object.keys(gameStats).map(k => ({ name: k, ...gameStats[k] }));
const rankingStats =
  statsList.filter(
    x => x.name !== "历史游戏"
  );

  const topProfit = [...rankingStats].sort((a, b) => b.profit - a.profit).slice(0, 3);
  let profitRankHtml = topProfit.length > 0 ? topProfit.map((item, idx) => `
    <div class="rank-item">
      <span>${idx + 1}. ${item.name}</span>
      <strong style="color: ${item.profit >= 0 ? '#00b894' : '#d63031'};"> ¥${formatMoney(item.profit)}
</strong>
    </div>
  `).join('') : `<div class="empty-tip" style="padding: 5px 0;">暂无销售数据</div>`;
  document.getElementById("topProfitGames").innerHTML = profitRankHtml;

  const topSold = [...rankingStats].sort((a, b) => b.sold - a.sold).slice(0, 3);
  let soldRankHtml = topSold.length > 0 ? topSold.map((item, idx) => `
    <div class="rank-item">
      <span>${idx + 1}. ${item.name}</span>
      <strong>${item.sold} 张</strong>
    </div>
  `).join('') : `<div class="empty-tip" style="padding: 5px 0;">暂无销售数据</div>`;
  document.getElementById("topSoldGames").innerHTML = soldRankHtml;

  let metricsHtml = "";
  if (soldDiscs.length > 0) {
    let totalSellPriceSum = 0, totalCostSum = 0;
    soldDiscs.forEach(d => {
      totalSellPriceSum += Number(d.selling_price || 0);
      totalCostSum += Number(d.purchase_price || 0) + Number(d.shipping_cost || 0);
});
const avgSalePrice =
  totalSellPriceSum / soldDiscs.length;

    const avgProfitPerDisc = ((totalSellPriceSum - totalCostSum) / soldDiscs.length).toFixed(1);
    metricsHtml = `
      <div class="rank-item"><span>区间单盘平均净利润</span><strong style="color: #00b894;">¥${avgProfitPerDisc}</strong></div>
      <div class="rank-item"><span>区间已售出盘数</span><strong>${soldDiscs.length} 张</strong></div>
<div class="rank-item">
  <span>平均售价</span>
  <strong style="color:#0984e3;">
    ¥${formatMoney(avgSalePrice)}
  </strong>
</div>

    `;
  } else {
    metricsHtml = `<div class="empty-tip" style="padding: 5px 0;">暂无销售数据</div>`;
  }
  document.getElementById("businessMetrics").innerHTML = metricsHtml;
//renderSalesChart(timeMap);
}
function renderSalesChart(timeMap) {
  const canvas =
    document.getElementById("salesChart");
  if (!canvas) {
    console.log("salesChart not found");
    return;
  }
  const ctx = canvas.getContext("2d");
  const labels =
    Object.keys(timeMap).sort();
  const data =
    labels.map(
      x => timeMap[x].sales
    );
  if (salesChart) {
    salesChart.destroy();
  }
  salesChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels,
      datasets: [{
        label: "销售额",
        data,
        backgroundColor: "#6c5ce7"
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

function uploadLocalCover(gameName) {
  const fileInput = document.getElementById("localCoverFile");
  if (!fileInput.files || fileInput.files.length === 0) {
    alert("请先选择一张图片");
    return;
  }

  const file = fileInput.files[0];
  const reader = new FileReader();

  reader.onload = async function(e) {
    const base64Image = e.target.result;

    await fetch(`${SUPABASE_URL}/rest/v1/games_inventory?game_name=eq.${encodeURIComponent(gameName)}`, {
      method: "PATCH",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ cover_url: base64Image })
    });

    alert("🎉 自定义相册封面上传成功！");
    closeModal();
    loadGames();
  };

  reader.readAsDataURL(file);
}
